name: 'streamsense_ai'
version: '1.0.0'
config-version: 2

profile: 'streamsense_ai'

# The Snowflake Kafka Sink Connector lands each Avro record into a VARIANT
# column named RECORD_CONTENT (with schematization disabled). Staging models
# read the payload through this var so the source column is configurable.
vars:
  payload_col: RECORD_CONTENT

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  streamsense_ai:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
